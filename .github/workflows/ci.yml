name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt + HDF5 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev qt6-svg-dev \
            libgl1-mesa-dev python3-pil fonts-dejavu-core libhdf5-dev
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          # qtsvg is a default archive on modern Qt, not an aqt "module" — do not pass modules: qtsvg
          version: '6.7.0'
          arch: win64_msvc2019_64
          cache: true
      - name: Install Pillow (Windows golden compares)
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade pip pillow
      - name: Install HDF5 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Outer release zip only wraps HDF5-1.14.5-win64.zip (cmake/include/lib live inside).
          $url = "https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.5/hdf5-1.14.5-win-vs2022_cl.zip"
          $zip = "$env:RUNNER_TEMP\hdf5-outer.zip"
          $stage = "$env:RUNNER_TEMP\hdf5-stage"
          $dest = "C:\HDF5"
          Invoke-WebRequest -Uri $url -OutFile $zip
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $stage -Force
          $inner = Get-ChildItem -Path $stage -Recurse -Filter "HDF5-*-win64.zip" | Select-Object -First 1
          if (-not $inner) { throw "inner HDF5-*-win64.zip not found in release zip" }
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -Path $inner.FullName -DestinationPath $dest -Force
          $prefix = Join-Path $dest "HDF5-1.14.5-win64"
          if (-not (Test-Path (Join-Path $prefix "include\hdf5.h"))) { throw "hdf5.h missing under $prefix" }
          "HDF5_ROOT=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HDF5_DIR=$prefix\cmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "HDF5_ROOT=$prefix"
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHDF5_ROOT=%HDF5_ROOT% -DHDF5_DIR=%HDF5_DIR%
      - name: Build
        run: cmake --build build --config Release
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120 --progress
        env:
          S100_TESTDATA: testdata/s101
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
      - name: Test (Windows)
        if: runner.os == 'Windows'
        # Exclude viewer_* : Qt offscreen/show+grab hangs on headless Windows runners (no log for 50+ min).
        # Linux CI still runs viewer_snapshot / viewer_golden / viewer_palettes.
        # Per-test --timeout so a future hang fails the job instead of parking forever.
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120 --progress -E "viewer_"
        env:
          S100_TESTDATA: testdata/s101
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
      - name: Upload golden mismatch (Linux)
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: golden-iho-0008-ci
          path: build/golden_iho_0008.png
          if-no-files-found: ignore
