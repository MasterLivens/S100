name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt + HDF5 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev qt6-svg-dev \
            libgl1-mesa-dev python3-pil fonts-dejavu-core libhdf5-dev libssl-dev
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          # qtsvg is a default archive on modern Qt, not an aqt "module" — do not pass modules: qtsvg
          version: '6.7.0'
          arch: win64_msvc2019_64
          cache: true
      - name: Install Pillow (Windows golden compares)
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade pip pillow
      - name: Install HDF5 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Outer release zip only wraps HDF5-1.14.5-win64.zip (cmake/include/lib live inside).
          $url = "https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.5/hdf5-1.14.5-win-vs2022_cl.zip"
          $zip = "$env:RUNNER_TEMP\hdf5-outer.zip"
          $stage = "$env:RUNNER_TEMP\hdf5-stage"
          $dest = "C:\HDF5"
          Invoke-WebRequest -Uri $url -OutFile $zip
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $stage -Force
          $inner = Get-ChildItem -Path $stage -Recurse -Filter "HDF5-*-win64.zip" | Select-Object -First 1
          if (-not $inner) { throw "inner HDF5-*-win64.zip not found in release zip" }
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -Path $inner.FullName -DestinationPath $dest -Force
          $prefix = Join-Path $dest "HDF5-1.14.5-win64"
          if (-not (Test-Path (Join-Path $prefix "include\hdf5.h"))) { throw "hdf5.h missing under $prefix" }
          "HDF5_ROOT=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HDF5_DIR=$prefix\cmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Runtime DLLs (hdf5.dll + zlib/szip deps) must be on PATH or every native
          # test hangs ~120s on a missing-DLL dialog under headless Windows runners.
          $bin = Join-Path $prefix "bin"
          if (-not (Test-Path (Join-Path $bin "hdf5.dll"))) { throw "hdf5.dll missing under $bin" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "HDF5_ROOT=$prefix"
          Write-Host "HDF5 bin on PATH: $bin"
      - name: OpenSSL runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest ships Shining Light OpenSSL under "C:\Program Files\OpenSSL".
          # Missing libcrypto-3-x64.dll hangs ~120s on a missing-DLL dialog — fail fast.
          # Wrap Where-Object in @(): a single match is a scalar string, and $roots[0]
          # on a string is the first character ("C") — which broke OPENSSL_ROOT_DIR.
          $roots = @(
            @(
              "C:\Program Files\OpenSSL",
              "C:\Program Files\OpenSSL-Win64",
              $env:OPENSSL_ROOT_DIR
            ) | Where-Object { $_ -and (Test-Path $_) }
          )
          $found = $null
          $opensslRoot = $null
          foreach ($r in $roots) {
            $dll = Join-Path $r "bin\libcrypto-3-x64.dll"
            if (Test-Path $dll) {
              $found = $dll
              $bin = Join-Path $r "bin"
              $opensslRoot = $r
              break
            }
          }
          if (-not $found) {
            Get-ChildItem "C:\Program Files" -Filter "OpenSSL*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            throw "libcrypto-3-x64.dll not found under OpenSSL install (fail-fast; do not hang on missing-DLL dialog)"
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # Forward slashes avoid cmd.exe quoting pitfalls; CMake accepts them on Windows.
          $opensslRootCmake = $opensslRoot -replace '\\', '/'
          "OPENSSL_ROOT_DIR=$opensslRootCmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "OPENSSL_ROOT_DIR=$opensslRootCmake"
          Write-Host "OpenSSL DLL on PATH: $found"
          where.exe libcrypto-3-x64.dll
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        # Quote OPENSSL_ROOT_DIR: path contains spaces ("C:/Program Files/OpenSSL").
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHDF5_ROOT="%HDF5_ROOT%" -DHDF5_DIR="%HDF5_DIR%" -DOPENSSL_ROOT_DIR="%OPENSSL_ROOT_DIR%"
      - name: Build
        run: cmake --build build --config Release
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120 --progress
        env:
          S100_TESTDATA: testdata/s101
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
      - name: Test (Windows)
        if: runner.os == 'Windows'
        # IHO-S101-TEXT-COLLISION + POINT-LABEL O1=(b): exclude other viewer_* (Qt offscreen
        # hang risk); narrow-open viewer_text_collision and viewer_point_label_collision only.
        # TEXT's (b) does not auto-cover POINT-LABEL. Hang on POINT-LABEL → fall back to (a).
        # Per-test --timeout so a hang fails the job instead of parking forever.
        # HDF5 bin is on PATH via GITHUB_PATH from Install HDF5 (shared dll load at process start).
        run: |
          ctest --test-dir build -C Release --output-on-failure --timeout 120 --progress -E "viewer_"
          ctest --test-dir build -C Release --output-on-failure --timeout 120 --progress -R "^viewer_text_collision$"
          ctest --test-dir build -C Release --output-on-failure --timeout 120 --progress -R "^viewer_point_label_collision$"
        env:
          S100_TESTDATA: testdata/s101
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
      - name: Upload golden mismatch (Linux)
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: golden-iho-0008-ci
          path: build/golden_iho_0008.png
          if-no-files-found: ignore
