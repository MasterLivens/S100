name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt + HDF5 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev qt6-svg-dev \
            libgl1-mesa-dev python3-pil fonts-dejavu-core libhdf5-dev
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          # qtsvg is a default archive on modern Qt, not an aqt "module" — do not pass modules: qtsvg
          version: '6.7.0'
          arch: win64_msvc2019_64
          cache: true
      - name: Install Pillow (Windows golden compares)
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade pip pillow
      - name: Install HDF5 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Official HDF Group Windows VS2022 CMake zip (reproducible; choco package missing)
          $url = "https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.5/hdf5-1.14.5-win-vs2022_cl.zip"
          $zip = "$env:RUNNER_TEMP\hdf5.zip"
          $dest = "C:\HDF5"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = Get-ChildItem $dest -Directory -Recurse -Filter "cmake" | Select-Object -First 1
          if ($root) { $prefix = $root.Parent.FullName } else {
            $prefix = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
          }
          if (-not $prefix) { throw "HDF5 extract failed" }
          "HDF5_ROOT=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_PREFIX_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "HDF5_ROOT=$prefix"
          Get-ChildItem $prefix | Select-Object -First 20 | ForEach-Object { Write-Host $_.Name }
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          S100_TESTDATA: testdata/s101
      - name: Upload golden mismatch (Linux)
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: golden-iho-0008-ci
          path: build/golden_iho_0008.png
          if-no-files-found: ignore
